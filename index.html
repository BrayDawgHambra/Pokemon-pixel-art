<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Pixel Art Guessing Game - All 1025 Pokemon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2em;
            color: #666;
        }

        .pokemon-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pokemon-image {
            max-width: 200px;
            max-height: 200px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: filter 0.3s ease;
        }

        .difficulty-controls {
            margin-bottom: 20px;
        }

        .difficulty-slider {
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
            display: block;
        }

        .difficulty-labels {
            display: flex;
            justify-content: space-between;
            max-width: 300px;
            margin: 0 auto;
            font-size: 0.9em;
            color: #666;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .pokemon-input {
            width: 100%;
            max-width: 300px;
            padding: 12px 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .pokemon-input:focus {
            border-color: #667eea;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-left: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .feedback.hint {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .control-btn:hover {
            background: #5a6268;
        }

        .hint-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .pokemon-image {
                max-width: 150px;
                max-height: 150px;
            }
        }
    </style>
</head>

        const pokemonImage = document.getElementById('pokemonImage');
        const pokemonInput = document.getElementById('pokemonInput');
        const submitBtn = document.getElementById('submitBtn');
        const feedback = document.getElementById('feedback');
        const currentNumberSpan = document.getElementById('currentNumber');
        const scoreSpan = document.getElementById('score');
        const streakSpan = document.getElementById('streak');
        const progressFill = document.getElementById('progressFill');
        const difficultySlider = document.getElementById('difficultySlider');
        const hintText = document.getElementById('hintText');

        // Bulbapedia image URL pattern
        function getPokemonImageUrl(pokemonName) {
            const formattedName = pokemonName.replace(/[:\s]/g, '_');
            // Using the official Bulbapedia image URL pattern
            return `https://archives.bulbagarden.net/media/upload/thumb/0/0f/${formattedName}_art.png/200px-${formattedName}_art.png`;
        }

        // Apply difficulty filter to image
        function applyDifficultyFilter(level) {
            const blurAmount = (11 - level) * 0.5; // Inverse relationship
            const brightness = 0.3 + (level * 0.07); // Brighter at higher difficulty
            
            pokemonImage.style.filter = `blur(${blurAmount}px) brightness(${brightness})`;
        }

        // Get hint for current Pokemon
        function getHint() {
            const pokemon = pokemonData[currentPokemonIndex];
            const hints = [
                `This Pokemon's name starts with "${pokemon[0]}" and has ${pokemon.length} letters.`,
                `This Pokemon's name ends with "${pokemon[pokemon.length - 1]}".`,
                `This Pokemon is number ${currentPokemonIndex + 1} in the Pokedex.`,
                `This Pokemon's name contains ${pokemon.replace(/[^aeiou]/gi, '').length} vowels.`
            ];
            
            return hints[Math.floor(Math.random() * hints.length)];
        }

        // Load new Pokemon
        function loadPokemon() {
            if (currentPokemonIndex >= pokemonData.length) {
                showFeedback('🎉 Congratulations! You\'ve completed all 1025 Pokemon! 🎉', 'correct');
                return;
            }

            const pokemon = pokemonData[currentPokemonIndex];
            pokemonImage.src = getPokemonImageUrl(pokemon);
            pokemonImage.alt = pokemon;
            
            applyDifficultyFilter(difficulty);
            
            currentNumberSpan.textContent = currentPokemonIndex + 1;
            progressFill.style.width = `${(currentPokemonIndex / pokemonData.length) * 100}%`;
            
            pokemonInput.value = '';
            pokemonInput.focus();
            hintText.textContent = '';
            feedback.textContent = '';
            feedback.className = 'feedback';
        }

        // Show feedback
        function showFeedback(message, type) {
            feedback.textContent = message;
            feedback.className = `feedback ${type}`;
        }

        // Check answer
        function checkAnswer() {
            const userAnswer = pokemonInput.value.trim().toLowerCase();
            const correctAnswer = pokemonData[currentPokemonIndex].toLowerCase();
            
            if (userAnswer === correctAnswer) {
                score++;
                streak++;
                unlockedPokemon.add(currentPokemonIndex + 1); // Unlock next Pokemon
                showFeedback(`✅ Correct! It's ${pokemonData[currentPokemonIndex]}!`, 'correct');
                
                setTimeout(() => {
                    currentPokemonIndex++;
                    loadPokemon();
                }, 2000);
            } else {
                streak = 0;
                showFeedback(`❌ Wrong! It's ${pokemonData[currentPokemonIndex]}. Try again!`, 'incorrect');
            }
            
            scoreSpan.textContent = score;
            streakSpan.textContent = streak;
        }

        // Skip current Pokemon
        function skipPokemon() {
            currentPokemonIndex++;
            streak = 0;
            streakSpan.textContent = streak;
            loadPokemon();
        }

        // Show hint
        function showHint() {
            hintText.textContent = getHint();
            showFeedback('💡 Hint revealed!', 'hint');
        }

        // Reset game
        function resetGame() {
            if (confirm('Are you sure you want to reset your progress?')) {
                currentPokemonIndex = 0;
                score = 0;
                streak = 0;
                unlockedPokemon = new Set([0]);
                
                scoreSpan.textContent = score;
                streakSpan.textContent = streak;
                loadPokemon();
            }
        }

        // Event listeners
        submitBtn.addEventListener('click', checkAnswer);
        pokemonInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        document.getElementById('skipBtn').addEventListener('click', skipPokemon);
        document.getElementById('hintBtn').addEventListener('click', showHint);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        difficultySlider.addEventListener('input', (e) => {
            difficulty = parseInt(e.target.value);
            applyDifficultyFilter(difficulty);
        });

        // Initialize game
        loadPokemon();
    </script>
</body>
</html>
